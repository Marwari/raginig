version: '3.8'

services:
  ragini-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raginig_portal
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VIRTUAL_HOST=raginig.com,www.raginig.com
      - LETSENCRYPT_HOST=raginig.com,www.raginig.com
    volumes:
      - ./certs:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
