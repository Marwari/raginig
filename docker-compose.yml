version: '3.8'

services:
  ragini-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raginig_portal
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
